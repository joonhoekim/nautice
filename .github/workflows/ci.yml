# Conformance compares both implementations and needs pwsh to do more than half
# the job; GitHub runners have it on all three OSes.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only token, stated here rather than left to the repository default.
permissions:
  contents: read

jobs:
  conformance:
    name: conformance (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Without pwsh the comparisons are skipped and pass silently. Do not fall
      # back to nix here; the next step fails outright instead.
      NAUTICE_TEST_NIX_PWSH: 0
    steps:
      - uses: actions/checkout@v7

      - name: Require pwsh
        shell: bash
        run: command -v pwsh || command -v powershell

      # So doctor reports a real TTS backend.
      - name: Install espeak-ng
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y espeak-ng

      - name: Conformance tests
        shell: bash
        run: ./test/conformance

      # On Windows there is nothing to compare against, but this is the only
      # place System.Speech really runs — under PowerShell 5.1, as nautice.cmd uses.
      - name: Windows smoke test
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          .\bin\nautice.ps1 doctor
          .\bin\nautice.ps1 list voices

  # The installers are a second pair of implementations. Feeding freshly built
  # assets through NAUTICE_ARCHIVE runs the real install path on every PR.
  install:
    name: install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Build assets
        shell: bash
        run: python3 tools/mkdist

      # Assets are served as application/octet-stream like GitHub release assets
      # and piped the way the README tells users to. The server starts inside
      # the step that uses it; background processes need not outlive a step.
      - name: Install (unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          python3 test/serve dist 8765 &
          for _ in $(seq 20); do curl -fsS -o /dev/null http://127.0.0.1:8765/SHA256SUMS && break; sleep 0.5; done
          curl -fsSL http://127.0.0.1:8765/install.sh \
            | NAUTICE_PREFIX="$RUNNER_TEMP/p" NAUTICE_ARCHIVE=http://127.0.0.1:8765/nautice-unix.tar.gz bash
          "$RUNNER_TEMP/p/bin/nautice" --version

      - name: Uninstall (unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          NAUTICE_PREFIX="$RUNNER_TEMP/p" NAUTICE_UNINSTALL=1 bash install.sh
          test ! -e "$RUNNER_TEMP/p/bin/nautice" || { echo "not removed" >&2; exit 1; }

      # Windows PowerShell 5.1 running irm | iex on an octet-stream response: the
      # one place a BOM or non-ASCII byte in install.ps1 would break the install.
      - name: Install (windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          Start-Process python -ArgumentList 'test/serve', 'dist', '8765' -WindowStyle Hidden
          foreach ($i in 1..20) {
            try { Invoke-WebRequest http://127.0.0.1:8765/SHA256SUMS -UseBasicParsing | Out-Null; break }
            catch { Start-Sleep -Milliseconds 500 }
          }
          $env:NAUTICE_PREFIX = "$env:RUNNER_TEMP\p"
          $env:NAUTICE_ARCHIVE = 'http://127.0.0.1:8765/nautice-windows.zip'
          irm http://127.0.0.1:8765/install.ps1 | iex
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$env:RUNNER_TEMP\p\bin\nautice.ps1" list sounds

      - name: Uninstall (windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $env:NAUTICE_PREFIX = "$env:RUNNER_TEMP\p"
          $env:NAUTICE_UNINSTALL = '1'
          .\install.ps1
          if (Test-Path "$env:RUNNER_TEMP\p\bin\nautice.ps1") { Write-Error 'not removed'; exit 1 }

  nix:
    name: nix build (includes shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix build .#nautice -L
