# Publishes release assets for a v* tag. Asset names carry no version, so
# releases/latest/download/<name> works without an API call (docs/install.md).
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A mismatch would ship contents that disagree with the release name, and
      # undoing it means deleting the tag.
      - name: Check tag matches source version
        run: |
          tag=${GITHUB_REF_NAME#v}
          src=$(sed -n 's/^VERSION=//p' bin/nautice)
          if [ "$tag" != "$src" ]; then
            echo "tag $GITHUB_REF_NAME does not match source version $src" >&2
            exit 1
          fi
          echo "$GITHUB_REF_NAME"

      # Releases do not wait for CI, so check again. The ubuntu runner has pwsh,
      # so both implementations are compared.
      - name: Conformance tests
        run: ./test/conformance

      - name: Build assets
        run: python3 tools/mkdist

      # Install from the built assets: a broken archive is the usual release failure.
      - name: Install from assets
        run: |
          NAUTICE_PREFIX="$RUNNER_TEMP/p" NAUTICE_ARCHIVE=dist/nautice-unix.tar.gz \
            bash install.sh
          "$RUNNER_TEMP/p/bin/nautice" --version

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/nautice-unix.tar.gz dist/nautice-windows.zip dist/SHA256SUMS \
            --title "$GITHUB_REF_NAME" --generate-notes
